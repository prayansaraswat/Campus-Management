{% extends "base.html" %}
{% block title %}{{ title }} - Campus Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 text-center">
    <div class="card shadow-sm border-0 p-5 rounded-4">
      <div class="display-1 text-danger mb-3 fw-bold">{{ status_code }}</div>
      <h2 class="h3 fw-semibold mb-3">{{ title }}</h2>
      <p class="text-muted fs-6 mb-4">{{ message }}</p>
      <div>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 me-2">
          <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
        <a href="{{ url_for('main.directory') }}" class="btn btn-outline-secondary px-4">
          <i class="bi bi-person-lines-fill me-1"></i> Staff Directory
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
